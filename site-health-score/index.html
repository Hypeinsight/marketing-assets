<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=https://hypeinsight.com/site-health-score/">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="canonical" href="https://hypeinsight.com/site-health-score/">
<title>Redirecting to hypeinsight.com/site-health-score/</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #02202E; color: #F6EFDD; text-align: center; padding: 80px 20px; }
  a { color: #E85D2F; }
</style>
</head>
<body>
<script>
  // The Site Health Score lives on hypeinsight.com now (same-origin with the
  // Cloudflare Worker that studies visitor sites). Preserve any URL params
  // (?url=&email=&name=&source=) through the hop so the personalised banner
  // and site-study still fire on the destination.
  var qs = window.location.search || '';
  window.location.replace('https://hypeinsight.com/site-health-score/' + qs);
</script>
<h1>The Site Health Score has moved.</h1>
<p>If you are not redirected automatically, <a href="https://hypeinsight.com/site-health-score/">click here</a>.</p>
</body>
</html>
